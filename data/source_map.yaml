project_name: "knowledge_base"

questions:
    authority:
        question: "What makes engineering information authoritative?"
        summary: "Defines what information having authority means."
        reasoning:
            status: "complete"
            worksheet_path: "reasoning/worksheets/authority.md"
        knowledge:
            type: "classification"
            path: "design/classifications/authority.md"
        prerequisites: []
    
    documentation_definition:
        question: "What is repository documentation?"
        summary:  "Defines what repository documentation is in the context of the knowledge base."
        reasoning:
            status: "in progress"
            worksheet_path: "reasoning/worksheets/documentation_definition.md"
        prerequisites: []

    engineering_information_types:
        question: "What types of engineering information exist?"
        summary: "Defines all the types of information that exist within the system, including knowledge base and repo information types."
        reasoning:
            status: "complete"
            worksheet_path: "reasoning/worksheets/engineering_information_types.md"
        knowledge:
            type: "classification"
            path: "design/classifications/engineering_information_types.md"
        prerequisites: []

    engineering_phases:
        question: "What are the phases of engineering?"
        summary: "Defines the steps that would take place in a typical engineering lifecycle."
        reasoning:
            status: "complete"
            worksheet_path: "reasoning/worksheets/engineering_phases.md"
        knowledge:
            type: "classification"
            path: "design/classifications/engineering_phases.md"
        prerequisites: []

    engineering_reasoning_phases:
        question: "What are the phases of engineering reasoning?"
        summary: "Defines the typical phases of reasoning an engineer would go through to arrive at an answer to a particular question."
        reasoning:
            status: "complete"
            worksheet_path: "reasoning/worksheets/engineering_reasoning_phases.md"
        knowledge:
            type: "classification"
            path: "design/classifications/engineering_reasoning_phases.md"
        prerequisites: []

    kb_organization:
        question: "How should the knowledge base be organized?"
        summary: "Decides on the top-level structure of the knowledge base."
        reasoning:
            status: "in_progress"
            worksheet_path: "reasoning/worksheets/kb_organization.md"
        prerequisites: []

    information_authority:
        question: "What is the authoritative source for each engineering information type?"
        summary: "Maps engineering information types to their authoritative source."
        reasoning:
            status: "in progress"
            worksheet_path: "reasoning/worksheets/information_authority.md"
        prerequisites:
            - kb_repo_responsibility
            - information_type_authority

    kb_repo_responsibility:
        question: "What are the responsibilities of the Knowledge Base and Repository?"
        summary: "Decides what types of information the knowledge base and repository are responsible for."
        reasoning:
            status: "complete"
            worksheet_path: "reasoning/worksheets/kb_repo_responsibility.md"
        knowledge:
            type: "adr"
            path: "design/adrs/000x-kb_repo_responsibility.md"
        prerequisites:
            - engineering_information_types

    information_type_authority:
        question: "Which engineering information types are authoritative?"
        summary: "Given all the types of engineering information, which can be considered as a source of truth?"
        reasoning:
            status: "complete"
            worksheet_path: "reasoning/worksheets/information_type_authority.md"
        knowledge:
            type: "classification"
            path: "design/classifications/information_type_authority.md"
        prerequisites:
            - authority
            - engineering_information_types

    documentation_responsibility:
        question: "What responsibilities should repository documentation have?"
        summary: "Decides what responsibility repository documentation should have."
        reasoning:
            status: "in_progress"
            worksheet_path: "reasoning/worksheets/documentation_responsibility.md"
        prerequisites:
            - documentation_definition

    kb_repo_docs_relationship:
        question: "What relationship should exist between repository documentation and the knowledge base?"
        summary: "Decides how information should be distributed between the knowledge base and repository docs."
        reasoning:
            status: "in_progress"
            worksheet_path: "reasoning/worksheets/kb_repo_docs_relationship.md"
        prerequisites:
            - information_authority
            - documentation_definition

    project_artifact_organization:
        question: "How should project artifacts be organized?"
        summary: "Given knowledge base top-level organization, decides how to organize sub-folders."
        reasoning:
            status: "complete"
            worksheet_path: "reasoning/worksheets/project_artifact_organization.md"
        knowledge:
            type: "adr"
            path: "design/adrs/000x-project_artifact_organization.md"
        prerequisites:
            - kb_organization
            - engineering_phases