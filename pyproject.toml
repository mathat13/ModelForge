[project]
name = "modelforge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mathat13", email = "lovell.jwz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "typer>=0.27.1",
]

[project.scripts]
modelforge = "modelforge.presentation.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.1.1",
]
